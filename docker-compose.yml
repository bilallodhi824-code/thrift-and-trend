services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: thrift_mssql
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Password123!
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Password123!' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: thrift_api
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DB_SERVER=mssql
      - DB_NAME=ThriftAndTrendDB
      - DB_USER=sa
      - DB_PASSWORD=Password123!
      - DB_PORT=1433
      - DB_ENCRYPT=false
      - DB_TRUST_SERVER_CERT=true
      - JWT_SECRET=thrift_and_trend_jwt_super_secret_production_key_2026
      - CLIENT_URL=http://localhost
    ports:
      - "5000:5000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: thrift_web
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  mssql_data:
